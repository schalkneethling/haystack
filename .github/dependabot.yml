version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      include:
        - "*"
    # Packages that only work at matching versions update together, for version and security
    # updates alike. vite-plus can't be grouped with its vite alias. See "Dependency updates"
    # in plans/haystack-v1-implementation-plan.md.
    groups:
      # @cloudflare/vite-plugin requires a matching wrangler version.
      cloudflare-workers:
        patterns:
          - "wrangler"
          - "@cloudflare/vite-plugin"
      cloudflare-workers-security:
        applies-to: security-updates
        patterns:
          - "wrangler"
          - "@cloudflare/vite-plugin"
      # The @varlock plugins require the varlock release they shipped with, and import its
      # internals.
      varlock:
        patterns:
          - "varlock"
          - "@varlock/*"
      varlock-security:
        applies-to: security-updates
        patterns:
          - "varlock"
          - "@varlock/*"
      # @guidepup/playwright declares the lowest @guidepup/guidepup it works with as a peer
      # dependency, which pnpm doesn't enforce (#178). The VoiceOver workflow runs on Dependabot
      # branches whose group name starts with "guidepup".
      guidepup:
        patterns:
          - "@guidepup/*"
      guidepup-security:
        applies-to: security-updates
        patterns:
          - "@guidepup/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      include:
        - "*"
