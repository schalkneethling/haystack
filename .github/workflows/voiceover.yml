name: VoiceOver

# Screen reader tests with VoiceOver on macOS (see "Testing strategy" in
# plans/haystack-v1-implementation-plan.md). Advisory: not a required check, because VoiceOver
# automation is less reliable than the Quality job.
on:
  pull_request:
    branches: [main]
    # Any change to the apps, the shared packages or the dependencies can change what the
    # pages render, so only changes outside them (the plan, other workflows) skip this job. The
    # extension is the exception: the VoiceOver tests don't load it, and it changes no page.
    paths: &voiceover-paths
      - "apps/**"
      - "!apps/extension/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/voiceover.yml"
  push:
    branches: [main]
    paths: *voiceover-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceover-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  voiceover:
    # Not on Dependabot's pull requests, which wait a long time for a macOS runner and mostly
    # update packages that the page doesn't read aloud differently. The push to main after the
    # merge runs it, so a dependency that breaks a VoiceOver test is still caught there. The
    # exceptions are updates that change the VoiceOver tests' own tooling: GitHub Actions (this
    # file's actions) and the Guidepup and Playwright packages, whose names Dependabot puts in the
    # branch, as in dependabot/npm_and_yarn/guidepup/setup-0.29.4.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      startsWith(github.head_ref, 'dependabot/github_actions/') ||
      contains(github.head_ref, 'guidepup') ||
      contains(github.head_ref, 'playwright')
    # macOS 26, because VoiceOver's wording and behavior change between macOS releases. The
    # image still gets 26.x point releases, which can change them too.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true

      # Lets AppleScript control VoiceOver and grants the permissions it needs. The runner is
      # discarded after the job. No --macos-record: the recording needs ffmpeg-static's binary,
      # whose download pnpm-workspace.yaml does not allow.
      - run: vp -C apps/worker run voiceover:setup --ci

      - run: vp -C apps/worker run voiceover:install

      - run: vp -C apps/worker run test:voiceover --forbid-only --reporter=list,github

      # Also after a pass, because a test that passed on retry keeps the failed attempt's trace
      # and video, and after a timeout, which cancels the job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voiceover-results
          path: apps/worker/test-results/
          if-no-files-found: ignore
          retention-days: 14
