name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: false

      # Dependabot bumps vite-plus but not the vite alias that must name the same version, which
      # otherwise fails late, in the type check (commit eaa3bad). This runs before the install,
      # needs only Node.js, and says what to change.
      - name: Check the vite alias matches vite-plus
        run: node scripts/check-vite-alias.ts

      - run: vp install --frozen-lockfile

      # The same browser as `vp run e2e:install` locally (headless shell only), plus its Linux
      # system libraries. --fail-if-no-match makes a renamed package fail here, not later.
      - run: vp exec --filter @haystack/worker --fail-if-no-match playwright install --with-deps --only-shell chromium
      # Extensions need the full Chromium, which runs them headless; the headless shell can't
      # load them. Same as `vp -C apps/extension run e2e:install` locally.
      - run: vp exec --filter @haystack/extension --fail-if-no-match playwright install --with-deps --no-shell chromium
      - run: vp run quality
