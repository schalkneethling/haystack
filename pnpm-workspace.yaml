packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Needed only for the Guidepup setup tool's screen recording, which Haystack doesn't use. Its
  # install script downloads an ffmpeg binary.
  ffmpeg-static: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
