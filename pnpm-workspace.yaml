packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Needed only for the Guidepup setup tool's screen recording, which Haystack doesn't use. Its
  # install script downloads an ffmpeg binary.
  ffmpeg-static: false
  workerd: true
catalog:
  # The extension's browser tests import the Worker's test harness, which imports Playwright too.
  # Playwright throws when one test run loads two copies of it, so both packages use this version.
  "@playwright/test": ^1.64.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
patchedDependencies:
  # MSW passes an idle connection that undici opens after an aborted request through to the real
  # network, and that connection's failure (a failed DNS lookup of a .test host) then closes the
  # socket of the mocked request sent on it next. The patch drops such a connection when the next
  # request arrives. See #148.
  # WORKAROUND(@mswjs/interceptors): an idle passthrough connection fails the next mocked request | upstream: https://github.com/mswjs/interceptors/issues/881
  "@mswjs/interceptors@0.45.9": patches/@mswjs__interceptors@0.45.9.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
